<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ title or 'Assignment App' }}</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header class="container">
    <h1><a href="/assignments" class="brand">Assignment Submission App</a></h1>
    <nav>
      <a href="/assignments">Assignments</a>
      <a href="/assignments/new" class="btn">New Assignment</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="container muted">
    <p>&copy; {{ now().year }} Assignment App</p>
  </footer>
</body>
</html>
