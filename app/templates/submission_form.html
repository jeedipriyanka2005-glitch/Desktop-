{% extends 'base.html' %}
{% block content %}
<h2>Submit to {{ assignment.title }}</h2>
<form method="post" action="/assignments/{{ assignment.id }}/submit" enctype="multipart/form-data" class="card">
  <label>Your name
    <input type="text" name="student_name" required />
  </label>
  <label>Your email
    <input type="email" name="student_email" />
  </label>
  <label>File
    <input type="file" name="file" required />
  </label>
  <button type="submit" class="btn">Upload</button>
</form>
{% endblock %}
